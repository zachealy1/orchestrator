name: Community public beta
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact release-branch commit to publish (40-character SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: orchestrator-publication
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      staging: ${{ steps.ref.outputs.staging }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release
          fetch-depth: 0
          persist-credentials: false
      - id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          test "$GITHUB_REPOSITORY" = zachealy1/orchestrator
          test "$GITHUB_REF" = refs/heads/release
          [[ "$REF" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$REF" origin/release
          echo "sha=$REF" >> "$GITHUB_OUTPUT"
          echo "staging=community-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  stage:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          STAGING_TAG: ${{ needs.authorize.outputs.staging }}
        run: node scripts/release/stage-community.mjs prepare
  package:
    needs: [authorize, stage]
    environment: public-beta-signing
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: npm ci
      - name: Package and verify (ad-hoc signing, no Apple notarization)
        env:
          RELEASE_DISTRIBUTION: community
          RELEASE_SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          ORCHESTRATOR_UPDATER_PUBLIC_KEY: ${{ vars.ORCHESTRATOR_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/package-macos.mjs
      - name: Store only verified packages in the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          STAGING_TAG: ${{ needs.authorize.outputs.staging }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/release/stage-community.mjs upload
  publish:
    needs: [authorize, package]
    runs-on: ubuntu-latest
    environment: public-beta-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Reverify both source-bound packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_DISTRIBUTION: community
          STAGING_TAG: ${{ needs.authorize.outputs.staging }}
        run: |
          node scripts/release/stage-community.mjs download
          export RELEASE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          node scripts/release/publish.mjs
  report-failure:
    needs: [authorize, stage, package, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/tracking-issue.mjs
