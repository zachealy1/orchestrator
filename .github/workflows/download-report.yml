name: Public repository metrics
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Signed public beta]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: orchestrator-download-metrics
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'zachealy1/orchestrator' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'zachealy1/orchestrator' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Append public aggregate snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          # Separate read-only traffic credential; GITHUB_TOKEN cannot read traffic.
          REPO_TRAFFIC_TOKEN: ${{ secrets.REPO_TRAFFIC_TOKEN }}
        run: node scripts/release/store-download-report.mjs
