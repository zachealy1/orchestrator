name: Public download report
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Signed public beta]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: orchestrator-download-metrics
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Append public aggregate snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/store-download-report.mjs
