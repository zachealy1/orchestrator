name: Signed public beta
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact main-branch commit to release (40-character SHA)
        required: true
        type: string
      rehearsal:
        description: Build signed rehearsal artifacts (publicly accessible) without releasing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: orchestrator-publication
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: ref
        env:
          REF: ${{ inputs.ref }}
          APPROVED: ${{ vars.BETA_REHEARSAL_APPROVED }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$REHEARSAL" = true || test "$APPROVED" = true
          [[ "$REF" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$REF" origin/main
          echo "sha=$REF" >> "$GITHUB_OUTPUT"
  validate:
    needs: authorize
    uses: ./.github/workflows/validate-release.yml
    with:
      ref: ${{ needs.authorize.outputs.sha }}
      base: ${{ needs.authorize.outputs.sha }}
    secrets:
      RELEASE_TEST_CODEX_AUTH_JSON: ${{ secrets.RELEASE_TEST_CODEX_AUTH_JSON }}
      RELEASE_TEST_MODEL: ${{ secrets.RELEASE_TEST_MODEL }}
  sign:
    needs: [authorize, validate]
    environment: public-beta-signing
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: npm ci
      - name: Build, sign, notarize and verify final artifacts
        env:
          BETA_REHEARSAL_APPROVED: ${{ vars.BETA_REHEARSAL_APPROVED }}
          ORCHESTRATOR_UPDATER_PUBLIC_KEY: ${{ vars.ORCHESTRATOR_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release/package-macos.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-${{ matrix.runner }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
  publish:
    if: inputs.rehearsal == false && vars.BETA_REHEARSAL_APPROVED == 'true'
    needs: [authorize, sign]
    runs-on: ubuntu-latest
    environment: public-beta-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: signed-*
          path: release-artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          export RELEASE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          node scripts/release/publish.mjs
  report-failure:
    needs: [authorize, validate, sign, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/tracking-issue.mjs
