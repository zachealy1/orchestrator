<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = "system";
        try {
          const storedTheme = localStorage.getItem("orchestrator.theme");
          if (storedTheme === "light" || storedTheme === "dark") {
            preference = storedTheme;
          }
        } catch {
          // The React bootstrap will retry when storage becomes available.
        }
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Orchestrator</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #15202b;
      }

      .app-bootstrap {
        display: grid;
        height: 100%;
        place-items: center;
        color: #f9f8f8;
        font: 600 15px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-bootstrap-content {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .app-bootstrap-indicator {
        width: 16px;
        height: 16px;
        border: 2px solid #445c6d;
        border-top-color: #76c5f5;
        border-radius: 50%;
        animation: app-bootstrap-spin 700ms linear infinite;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: light) {
        body {
          background: #f9f8f8;
        }

        .app-bootstrap {
          color: #292f33;
        }

        .app-bootstrap-indicator {
          border-color: #e1e8ed;
          border-top-color: #0084b4;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-indicator {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-bootstrap" role="status" aria-label="Starting Orchestrator">
        <div class="app-bootstrap-content">
          <span class="app-bootstrap-indicator" aria-hidden="true"></span>
          <span>Orchestrator</span>
        </div>
      </div>
    </div>
    <script type="module">
      import("/src/main.tsx").catch((error) => {
        console.error("Orchestrator failed to start", error);
        const bootstrap = document.querySelector(".app-bootstrap-content");
        if (bootstrap) {
          bootstrap.textContent = `Startup failed: ${error instanceof Error ? error.message : String(error)}`;
        }
      });
    </script>
  </body>
</html>
