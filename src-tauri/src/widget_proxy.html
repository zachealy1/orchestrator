// Trusted relay. Widget code runs in a separate, opaque-origin inner frame.
let view;
addEventListener('message', event => {
  if (event.source === parent) {
    if (event.data?.method === 'ui/notifications/sandbox-resource-ready') {
      if (view) return;
      view = document.createElement('iframe');
      view.title = 'Tool interface content';
      view.setAttribute('sandbox', 'allow-scripts');
      view.src = location.href.replace(/\/proxy$/, '/view');
      document.body.append(view);
    } else if (view?.contentWindow) view.contentWindow.postMessage(event.data, '*');
  } else if (view && event.source === view.contentWindow) {
    // Inner content cannot impersonate the trusted sandbox lifecycle.
    if (event.data?.method === 'ui/notifications/sandbox-proxy-ready') return;
    parent.postMessage(event.data, '*');
  }
});
